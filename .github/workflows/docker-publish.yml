name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-ops:
    name: Update KoukeNeko-Ops
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out ops repository
        uses: actions/checkout@v6
        with:
          repository: KoukeNeko/KoukeNeko-Ops
          ref: main
          token: ${{ secrets.OPS_REPO_TOKEN }}
          path: koukeneko-ops

      - name: Update image tag
        working-directory: koukeneko-ops
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|^\([[:space:]]*image:[[:space:]]\)ghcr.io/koukeneko/nekoclaw:.*$|\1ghcr.io/koukeneko/nekoclaw:sha-${SHORT_SHA}|" apps/NekoClaw/deployment.yaml

      - name: Commit and push ops update
        working-directory: koukeneko-ops
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if git diff --quiet -- apps/NekoClaw/deployment.yaml; then
            echo "No ops update required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/NekoClaw/deployment.yaml
          git commit -m "chore: update nekoclaw image to sha-${SHORT_SHA}"
          git push origin HEAD:main
